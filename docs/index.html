<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>LAS Point Cloud Viewer</title>

  <!-- =========================================================
       MapLibre CSS
       ========================================================= -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.0.0/dist/maplibre-gl.css"
  >

  <style>

    html,
    body {

      margin: 0;
      width: 100%;
      height: 100%;

    }

    #map {

      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

    }

  </style>

</head>


<body>

  <!-- =========================================================
       Map
       ========================================================= -->
  <div id="map"></div>


  <!-- =========================================================
       Application
       ========================================================= -->
  <script type="module">

    /*
     * =========================================================
     * MapLibre
     * =========================================================
     *
     * jsDelivr の +esm は Module を返すため、
     *
     *   module.default
     *
     * にMapLibre本体が入る。
     *
     * =========================================================
     */

    import * as maplibreglModule
      from "https://cdn.jsdelivr.net/npm/maplibre-gl@5.0.0/+esm";


    /*
     * MapLibre本体を取得
     */
    const maplibregl =
      maplibreglModule.default;


    /*
     * =========================================================
     * Debug
     * =========================================================
     */

    console.log(
      "MapLibre module:",
      maplibreglModule
    );

    console.log(
      "MapLibre:",
      maplibregl
    );

    console.log(
      "Map:",
      maplibregl.Map
    );


    /*
     * =========================================================
     * COPC Layer
     * =========================================================
     */

    import {
      CopcLayer
    } from "https://cdn.jsdelivr.net/npm/maplibre-copc-layer@0.2.0/+esm";


    console.log(
      "CopcLayer:",
      CopcLayer
    );


    /*
     * =========================================================
     * MapLibre Map
     * =========================================================
     */

    const map =
      new maplibregl.Map({

        container: "map",

        style: {

          version: 8,

          sources: {},

          layers: []

        },

        center: [

          139.6200,
          35.7000

        ],

        zoom: 15,

        pitch: 60,

        bearing: 0

      });


    /*
     * =========================================================
     * MapLibre error
     * =========================================================
     */

    map.on(
      "error",
      (event) => {

        console.error(
          "MapLibre error:",
          event
        );

      }
    );


    /*
     * =========================================================
     * Map load
     * =========================================================
     */

    map.on(
      "load",
      () => {

        console.log(
          "MapLibre loaded"
        );


        /*
         * =====================================================
         * GSI aerial photo
         * =====================================================
         */

        map.addSource(

          "gsi-aerial",

          {

            type: "raster",

            tiles: [

              "https://cyberjapandata.gsi.go.jp/xyz/ort/{z}/{x}/{y}.jpg"

            ],

            tileSize: 256,

            attribution:
              '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a>'

          }

        );


        map.addLayer({

          id: "gsi-aerial",

          type: "raster",

          source: "gsi-aerial",

          paint: {

            "raster-opacity": 1.0

          }

        });


        /*
         * =====================================================
         * COPC Layer
         * =====================================================
         */

        const copcLayer =
          new CopcLayer({

            /*
             * Layer ID
             */
            id: "copc",

            /*
             * COPC / LAZ
             */
            url: "./sy.copc.laz",

            /*
             * =================================================
             * RGB
             * =================================================
             *
             * LASに入っているRGBを使用
             */

            colorMode: "rgb",


            /*
             * 点の大きさ
             */

            pointSize: 3,


            /*
             * 深度テスト
             */

            depthTest: false,


            /*
             * Root nodeを常に表示
             */

            alwaysShowRoot: true,


            /*
             * SSAO
             */

            enableSSAO: false,


            /*
             * Debug
             */

            debug: true,


            /*
             * =================================================
             * Initialized
             * =================================================
             */

            onInitialized: (layer) => {

              console.log(
                "COPC initialized:",
                layer
              );


              /*
               * Bounds
               */

              if (layer.bounds) {

                console.log(
                  "COPC bounds:",
                  layer.bounds
                );

              }

            }

          });


        /*
         * =====================================================
         * COPC LayerをMapLibreに追加
         * =================================================
         */

        console.log(
          "Adding COPC layer..."
        );


        map.addLayer(
          copcLayer
        );


        console.log(
          "COPC layer added"
        );

      }
    );


  </script>

</body>

</html>
