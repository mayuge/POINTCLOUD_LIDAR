<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>LAS Point Cloud Viewer</title>


  <!-- =========================================================
       MapLibre GL JS
       ========================================================= -->

<link
  href="https://unpkg.com/maplibre-gl@5.7.0/dist/maplibre-gl.css"
  rel="stylesheet"
>

<script
  src="https://unpkg.com/maplibre-gl@5.7.0/dist/maplibre-gl.js"
></script>


  <!-- =========================================================
       deck.gl
       ========================================================= -->

  <script
    src="https://unpkg.com/deck.gl@9.3.6/dist.min.js"
  ></script>


  <!-- =========================================================
       loaders.gl LAS
       ========================================================= -->

  <script
    src="https://unpkg.com/@loaders.gl/las@4.3.3/dist/dist.min.js"
  ></script>


  <!-- =========================================================
       proj4
       ========================================================= -->

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.15.0/proj4.js"
  ></script>


  <style>

    html,
    body {

      margin: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #111;

    }


    #map {

      width: 100%;
      height: 100%;

    }


    #info {

      position: absolute;

      left: 10px;
      bottom: 10px;

      z-index: 10;

      padding: 6px 10px;

      background: rgba(255, 255, 255, 0.85);

      font-family: sans-serif;

      font-size: 12px;

      pointer-events: none;

    }

  </style>

</head>


<body>


<div id="map"></div>


<div id="info">

  国土地理院「全国最新写真（シームレス）」＋ LAS

</div>


<script>


/*
 * ============================================================
 * 設定
 * ============================================================
 */

const CENTER = {

  longitude:
    139.6228812732044,

  latitude:
    35.70540600403263

};


const INITIAL_ZOOM = 18;


/*
 * ============================================================
 * LAS CRS
 * ============================================================
 *
 * JGD2011 / Japan Plane Rectangular CS IX
 * EPSG:6677
 *
 * ============================================================
 */

proj4.defs(

  "EPSG:6677",

  "+proj=tmerc " +
  "+lat_0=36 " +
  "+lon_0=139.8333333333333 " +
  "+k=0.9999 " +
  "+x_0=0 " +
  "+y_0=0 " +
  "+ellps=GRS80 " +
  "+units=m " +
  "+no_defs"

);


/*
 * ============================================================
 * LAS座標 → WGS84
 * ============================================================
 */

function convertCoordinate(x, y, z) {

  const result =

    proj4(

      "EPSG:6677",

      "EPSG:4326",

      [x, y]

    );


  return [

    result[0],

    result[1],

    z

  ];

}


/*
 * ============================================================
 * LAS RGB
 * ============================================================
 *
 * LAS Point Format 3 のRGBは16bit。
 *
 * deck.glは通常 0〜255 のRGBを使用するため、
 * 16bit → 8bit に変換する。
 *
 * ============================================================
 */

function convertColor(r, g, b) {

  /*
   * 16bit → 8bit
   */

  return [

    Math.round(r / 65535 * 255),

    Math.round(g / 65535 * 255),

    Math.round(b / 65535 * 255)

  ];

}


/*
 * ============================================================
 * LAS読み込み
 * ============================================================
 */

async function loadLAS() {

  console.log("LAS loading...");


  /*
   * LASファイル
   */

  const data =

    await loaders.load(

      "./sy.las",

      loaders.LASLoader

    );


  console.log("LAS loaded");

  console.log(data);


  /*
   * ==========================================================
   * 座標
   * ==========================================================
   */

  const positions =

    data.attributes.POSITION.value;


  /*
   * ==========================================================
   * RGB
   * ==========================================================
   */

  const colors =

    data.attributes.COLOR_0?.value;


  /*
   * ==========================================================
   * 点数
   * ==========================================================
   */

  const pointCount =

    data.header.vertexCount;


  console.log(

    "Point count:",

    pointCount

  );


  /*
   * RGB確認
   */

  if (colors) {

    console.log(

      "COLOR_0:",

      data.attributes.COLOR_0

    );


    console.log(

      "First raw RGB:",

      [

        colors[0],

        colors[1],

        colors[2],

        colors[3]

      ]

    );

  }

  else {

    console.log(

      "COLOR_0: not found"

    );

  }


  /*
   * ==========================================================
   * PointCloud用データ
   * ==========================================================
   */

  const points =

    new Array(pointCount);


  /*
   * ==========================================================
   * 1点ずつ変換
   * ==========================================================
   */

  for (
    let i = 0;
    i < pointCount;
    i++
  ) {


    /*
     * LAS座標
     */

    const x =

      positions[i * 3];


    const y =

      positions[i * 3 + 1];


    const z =

      positions[i * 3 + 2];


    /*
     * WGS84へ変換
     */

    const position =

      convertCoordinate(

        x,
        y,
        z

      );


    /*
     * ========================================================
     * RGB
     * ========================================================
     */

    let color = [

      255,
      255,
      255

    ];


    if (colors) {

      color =

        convertColor(

          colors[i * 4],

          colors[i * 4 + 1],

          colors[i * 4 + 2]

        );

    }


    /*
     * Point
     */

    points[i] = {

      position,

      color

    };

  }


  /*
   * ==========================================================
   * 確認
   * ==========================================================
   */

  console.log(

    "First converted point:",

    points[0]

  );


  return points;

}


/*
 * ============================================================
 * MapLibre
 * ============================================================
 *
 * GSIシームレス空中写真を
 * MapLibreのRaster Sourceとして設定する。
 *
 * ============================================================
 */

const map =

  new maplibregl.Map({

    container:
      "map",


    /*
     * MapLibre Style
     */

    style: {

      version: 8,


      /*
       * ======================================================
       * Sources
       * ======================================================
       */

      sources: {

        /*
         * GSI シームレス空中写真
         */

        "gsi-photo": {

          type:
            "raster",

          tiles: [

            "https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg"

          ],

          tileSize:
            256,

          attribution:
            "国土地理院"

        }

      },


      /*
       * ======================================================
       * Layers
       * ======================================================
       */

      layers: [

        {

          id:
            "gsi-photo",

          type:
            "raster",

          source:
            "gsi-photo",

          paint: {

            "raster-opacity":
              1

          }

        }

      ]

    },


    /*
     * ========================================================
     * 初期位置
     * ========================================================
     */

    center: [

      CENTER.longitude,

      CENTER.latitude

    ],


    zoom:
      INITIAL_ZOOM,


    /*
     * 真上から確認
     */

    pitch:
      0,

    bearing:
      0

  });


/*
 * ============================================================
 * MapLibre Navigation
 * ============================================================
 */

map.addControl(

  new maplibregl.NavigationControl(),

  "top-right"

);


/*
 * ============================================================
 * MapLibre → deck.gl
 * ============================================================
 *
 * MapLibreをベースマップとして使用し、
 * deck.glをOverlayとして重ねる。
 *
 * ============================================================
 */

async function setupDeckOverlay() {


  /*
   * ==========================================================
   * LAS
   * ==========================================================
   */

  const points =

    await loadLAS();


  /*
   * ==========================================================
   * PointCloudLayer
   * ==========================================================
   */

  const pointCloudLayer =

    new deck.PointCloudLayer({

      id:
        "las-point-cloud",


      /*
       * データ
       */

      data:
        points,


      /*
       * 座標
       */

      getPosition:

        d => d.position,


      /*
       * RGB
       */

      getColor:

        d => d.color,


      /*
       * 法線
       */

      getNormal:

        [0, 0, 1],


      /*
       * 点のサイズ
       */

      pointSize:
        2,


      /*
       * 選択
       */

      pickable:
        true,


      /*
       * Tooltip
       */

      getTooltip:

        ({ object }) => {

          if (!object) {

            return null;

          }


          return {

            text:

              `経度: ${
                object.position[0].toFixed(7)
              }\n` +

              `緯度: ${
                object.position[1].toFixed(7)
              }\n` +

              `標高: ${
                object.position[2].toFixed(2)
              } m`

          };

        }

    });


  /*
   * ==========================================================
   * MapLibre Overlay
   * ==========================================================
   */

  const overlay =

    new deck.MapboxOverlay({

      interleaved:
        true,

      layers: [

        pointCloudLayer

      ]

    });


  /*
   * ==========================================================
   * MapLibreへ追加
   * ==========================================================
   */

  map.addControl(

    overlay

  );


  console.log(

    "deck.gl overlay added"

  );

}


/*
 * ============================================================
 * Start
 * ============================================================
 */

map.on(

  "load",

  async () => {

    try {

      console.log(

        "MapLibre loaded"

      );


      await setupDeckOverlay();

    }

    catch (error) {

      console.error(

        "Viewer error:",

        error

      );

    }

  }

);


</script>


</body>

</html>
