<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LiDAR Viewer</title>

  <!-- MapLibre GL JS 6.7.0 -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/maplibre-gl@6.7.0/dist/maplibre-gl.css"
  >

  <!-- maplibre-gl-lidar -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/maplibre-gl-lidar@0.16.2/dist/maplibre-gl-lidar.css"
  >

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    #map {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

<div id="map"></div>

<script type="module">

  /*
   * ----------------------------------------
   * MapLibre GL JS
   * ----------------------------------------
   */

  import * as maplibregl
    from "https://unpkg.com/maplibre-gl@6.7.0/dist/maplibre-gl.mjs";


  /*
   * ----------------------------------------
   * maplibre-gl-lidar
   *
   * deck.gl 9.3.2 に固定
   * ----------------------------------------
   */

  import { LidarControl }
    from "https://esm.sh/maplibre-gl-lidar@0.16.2?deps=@deck.gl/core@9.3.2,@deck.gl/extensions@9.3.2,@deck.gl/layers@9.3.2,@deck.gl/mapbox@9.3.2";


  /*
   * ----------------------------------------
   * Map
   * ----------------------------------------
   */

  const map = new maplibregl.Map({

    container: "map",

    style:
      "https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json",

    center: [137, 36],

    zoom: 10,

    pitch: 60,

    maxPitch: 85

  });


  /*
   * ----------------------------------------
   * LiDAR
   * ----------------------------------------
   */

  map.on("load", () => {

    const lidarControl = new LidarControl({

      title: "LiDAR",

      collapsed: false,

      pointSize: 2,

      colorScheme: "elevation",

      pickable: true

    });


    map.addControl(
      lidarControl,
      "top-right"
    );


    lidarControl.on("load", () => {

      console.log("LiDAR loaded");

      lidarControl.flyToPointCloud();

    });


    /*
     * sy.las
     *
     * index.html と同じディレクトリ
     */

    lidarControl.loadPointCloud("./sy.las");

  });

</script>

</body>
</html>
