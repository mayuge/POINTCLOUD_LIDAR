<!doctype html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>荻窪3D</title>

	<link
		rel="stylesheet"
		href="https://unpkg.com/maplibre-gl@5.0.0/dist/maplibre-gl.css"
	>

	<style>
		html,
		body,
		#map {
			width: 100%;
			height: 100%;
			margin: 0;
			padding: 0;
		}

		body {
			overflow: hidden;
		}
	</style>
</head>

<body>

<div id="map"></div>

<script type="module">

	import maplibregl from
		"https://esm.sh/maplibre-gl@5.0.0?target=es2022"

	import { CopcLayer } from
		"https://esm.sh/maplibre-copc-layer@0.2.0?bundle"


	/*
	 * =========================================================
	 * MapLibre
	 * =========================================================
	 */

	const map = new maplibregl.Map({

		container: "map",

		style: {

			version: 8,

			sources: {

				/*
				 * -------------------------------------------------
				 * 地理院航空写真
				 * -------------------------------------------------
				 */

				"gsi-photo": {

					type: "raster",

					tiles: [
						"https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg"
					],

					tileSize: 256,

					attribution: "国土地理院"
				},


				/*
				 * -------------------------------------------------
				 * 産総研 陸地統合DEM
				 * -------------------------------------------------
				 */

				"terrain": {

					type: "raster-dem",

					tiles: [
						"https://gbank.gsj.jp/seamless/elev/terrainRGB/land/{z}/{y}/{x}.png"
					],

					tileSize: 256,

					encoding: "mapbox",

					attribution: "産総研 陸地統合DEM"
				}
			},


			/*
			 * ---------------------------------------------------
			 * MapLibre Layers
			 * ---------------------------------------------------
			 */

			layers: [

				{
					id: "gsi-photo",

					type: "raster",

					source: "gsi-photo"
				}
			],


			/*
			 * ---------------------------------------------------
			 * Terrain
			 * ---------------------------------------------------
			 */

			terrain: {

				source: "terrain",

				exaggeration: 1
			}
		},


		/*
		 * -----------------------------------------------------
		 * 初期表示
		 * -----------------------------------------------------
		 */

		hash: true,

		zoom: 17,

		center: [
			139.6203,
			35.7048
		],

		pitch: 60,

		bearing: 0,


		/*
		 * Attribution
		 */

		attributionControl: false
	})


	/*
	 * =========================================================
	 * Navigation
	 * =========================================================
	 */

	map.addControl(
		new maplibregl.NavigationControl()
	)


	/*
	 * =========================================================
	 * Attribution
	 * =========================================================
	 */

	map.addControl(

		new maplibregl.AttributionControl({

			compact: true,

			customAttribution:
				"地理院タイル"
		})
	)


	/*
	 * =========================================================
	 * COPC Point Cloud
	 * =========================================================
	 */

	const copcLayer = new CopcLayer(

		"./sy.copc.laz",

		{

			/*
			 * RGBカラー
			 */
			colorMode: "rgb",


			/*
			 * 点の大きさ
			 */
			pointSize: 3,


			/*
			 * 深度テスト
			 */
			depthTest: false,


			/*
			 * Root nodeを常に表示
			 */
			alwaysShowRoot: true,


			/*
			 * SSAO
			 */
			enableSSAO: false,


			/*
			 * デバッグ
			 */
			debug: true,


			/*
			 * -------------------------------------------------
			 * COPC読み込み完了
			 * -------------------------------------------------
			 */

			onInitialized: ({ bounds }) => {

				console.log(
					"COPC initialized",
					bounds
				)


				/*
				 * COPCの中心へ移動
				 */

				map.flyTo({

					center: [

						(bounds.minx + bounds.maxx) / 2,

						(bounds.miny + bounds.maxy) / 2
					],

					zoom: 17
				})
			}
		}
	)


	/*
	 * =========================================================
	 * Map Load
	 * =========================================================
	 */

	map.on("load", () => {

		map.addLayer(copcLayer)

	})

</script>

</body>
</html>
