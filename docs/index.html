```html
<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LAS Point Cloud Viewer</title>

  <!-- deck.gl -->
  <script src="https://unpkg.com/deck.gl@9.3.6/dist.min.js"></script>

  <!-- loaders.gl LAS -->
  <script src="https://unpkg.com/@loaders.gl/las@4.3.3/dist/dist.min.js"></script>

  <!-- proj4 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.15.0/proj4.js"></script>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
    }

    #app {
      width: 100%;
      height: 100%;
    }

    #info {
      position: absolute;
      left: 10px;
      bottom: 10px;
      z-index: 10;

      padding: 6px 10px;

      background: rgba(255, 255, 255, 0.85);

      font-family: sans-serif;
      font-size: 12px;

      pointer-events: none;
    }
  </style>
</head>

<body>

<div id="app"></div>

<div id="info">
  国土地理院「全国最新写真（シームレス）」＋ LAS
</div>


<script>


/*
 * ============================================================
 * 座標系
 * ============================================================
 *
 * LAS
 *
 * JGD2011 / Japan Plane Rectangular CS IX
 * EPSG:6677
 *
 * ↓
 *
 * WGS84
 * EPSG:4326
 *
 */


proj4.defs(
  "EPSG:6677",

  "+proj=tmerc " +
  "+lat_0=36 " +
  "+lon_0=139.8333333333333 " +
  "+k=0.9999 " +
  "+x_0=0 " +
  "+y_0=0 " +
  "+ellps=GRS80 " +
  "+units=m " +
  "+no_defs"
);


/*
 * ============================================================
 * LAS → WGS84
 * ============================================================
 */

function convertCoordinate(x, y, z) {

  const [longitude, latitude] =
    proj4(
      "EPSG:6677",
      "EPSG:4326",
      [x, y]
    );

  return [
    longitude,
    latitude,
    z
  ];
}


/*
 * ============================================================
 * LAS読み込み
 * ============================================================
 */

async function loadLAS() {

  console.log("LAS loading...");


  const data =
    await loaders.load(
      "./sy.las",
      loaders.LASLoader
    );


  console.log("LAS loaded");
  console.log(data);


  const positions =
    data.attributes.POSITION.value;


  const colors =
    data.attributes.COLOR_0?.value;


  const pointCount =
    data.header.vertexCount;


  console.log(
    "Point count:",
    pointCount
  );


  const points =
    new Array(pointCount);


  /*
   * ----------------------------------------------------------
   * 座標変換
   * ----------------------------------------------------------
   */

  for (let i = 0; i < pointCount; i++) {

    const x =
      positions[i * 3];

    const y =
      positions[i * 3 + 1];

    const z =
      positions[i * 3 + 2];


    const position =
      convertCoordinate(
        x,
        y,
        z
      );


    /*
     * RGB
     */

    let color = [
      255,
      255,
      255
    ];


    if (colors) {

      color = [

        colors[i * 4],

        colors[i * 4 + 1],

        colors[i * 4 + 2]

      ];

    }


    points[i] = {

      position,

      color

    };

  }


  console.log(
    "First converted point:",
    points[0]
  );


  return points;
}


/*
 * ============================================================
 * 地理院シームレス画像
 * ============================================================
 *
 * 国土地理院
 *
 * https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/
 *
 */


const gsiPhotoLayer =
  new deck.TileLayer({

    id: "gsi-seamless-photo",


    /*
     * 地理院シームレス空中写真
     */

    data:
      "https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg",


    /*
     * ズーム範囲
     */

    minZoom: 2,

    maxZoom: 18,


    /*
     * タイルサイズ
     */

    tileSize: 256,


    /*
     * TileLayer
     */

    renderSubLayers: tile => {

      const {
        bbox,
        data
      } = tile;


      if (!data) {
        return null;
      }


      return new deck.BitmapLayer({

        id:
          `${tile.id}-bitmap`,


        image:
          data,


        bounds: [

          bbox.west,
          bbox.south,

          bbox.east,
          bbox.north

        ],


        opacity:
          1

      });

    }

  });


/*
 * ============================================================
 * LAS Point Cloud
 * ============================================================
 */

async function createPointCloudLayer() {

  const points =
    await loadLAS();


  return new deck.PointCloudLayer({

    id:
      "las-point-cloud",


    data:
      points,


    /*
     * 座標
     */

    getPosition:
      d => d.position,


    /*
     * RGB
     */

    getColor:
      d => d.color,


    /*
     * 法線
     */

    getNormal:
      [0, 0, 1],


    /*
     * 点のサイズ
     */

    pointSize:
      2,


    /*
     * 選択可能
     */

    pickable:
      true,


    /*
     * Tooltip
     */

    getTooltip:
      ({ object }) => {

        if (!object) {
          return null;
        }


        return {

          text:

            `経度: ${
              object.position[0].toFixed(7)
            }\n` +

            `緯度: ${
              object.position[1].toFixed(7)
            }\n` +

            `標高: ${
              object.position[2].toFixed(2)
            } m`

        };

      }

  });
}


/*
 * ============================================================
 * Viewer
 * ============================================================
 */

async function main() {


  /*
   * LAS
   */

  const pointCloudLayer =
    await createPointCloudLayer();


  /*
   * ==========================================================
   * DeckGL
   * ==========================================================
   */

  new deck.DeckGL({

    container:
      "app",


    /*
     * Google Mapsで確認した座標
     */

    initialViewState: {

      longitude:
        139.6228812732044,

      latitude:
        35.70540600403263,

      zoom:
        18,

      pitch:
        60,

      bearing:
        0

    },


    /*
     * マウス操作
     */

    controller:
      true,


    /*
     * レイヤー
     *
     * 下
     * ↓
     * 地理院写真
     *
     * ↓
     *
     * LAS点群
     * ↑
     */

    layers: [

      gsiPhotoLayer,

      pointCloudLayer

    ]

  });

}


/*
 * ============================================================
 * Start
 * ============================================================
 */

main().catch(error => {

  console.error(
    "Viewer error:",
    error
  );

});

</script>

</body>
</html>
```
