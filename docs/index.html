<!doctype html>
<html lang="ja">

<head>

	<meta charset="UTF-8">

	<meta
		name="viewport"
		content="width=device-width, initial-scale=1.0"
	>

	<title>荻窪3D</title>


	<!-- =========================================================
	     MapLibre CSS
	     ========================================================= -->

	<link
		rel="stylesheet"
		href="https://unpkg.com/maplibre-gl@5.0.0/dist/maplibre-gl.css"
	>


	<!-- =========================================================
	     Style
	     ========================================================= -->

	<style>

		html,
		body,
		#map {

			width: 100%;
			height: 100%;

			margin: 0;
			padding: 0;

		}

		body {

			overflow: hidden;

		}

	</style>

</head>


<body>


	<!-- =========================================================
	     Map
	     ========================================================= -->

	<div id="map"></div>


	<!-- =========================================================
	     MapLibre GL JS
	     ========================================================= -->

	<script
		src="https://unpkg.com/maplibre-gl@5.0.0/dist/maplibre-gl.js"
	></script>


	<!-- =========================================================
	     Application
	     ========================================================= -->

	<script type="module">


		/*
		 * ========================================================
		 * COPC Layer
		 * ========================================================
		 */

		import {
			CopcLayer
		}
		from "https://esm.sh/maplibre-copc-layer@0.2.0?bundle"



		/*
		 * ========================================================
		 * MapLibre Map
		 * ========================================================
		 */

		const map = new maplibregl.Map({

			container: "map",


			/*
			 * ----------------------------------------------------
			 * Map Style
			 * ----------------------------------------------------
			 */

			style: {

				version: 8,


				/*
				 * ------------------------------------------------
				 * Sources
				 * ------------------------------------------------
				 */

				sources: {


					/*
					 * 地理院航空写真
					 */

					"gsi-photo": {

						type: "raster",

						tiles: [

							"https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg"

						],

						tileSize: 256,

						attribution: "国土地理院"

					},


					/*
					 * 産総研 陸地統合DEM
					 */

					"terrain": {

						type: "raster-dem",

						tiles: [

							"https://gbank.gsj.jp/seamless/elev/terrainRGB/land/{z}/{y}/{x}.png"

						],

						tileSize: 256,

						encoding: "mapbox",

						attribution: "産総研 陸地統合DEM"

					}

				},


				/*
				 * ------------------------------------------------
				 * Layers
				 * ------------------------------------------------
				 */

				layers: [

					{
						id: "gsi-photo",

						type: "raster",

						source: "gsi-photo"
					}

				],


				/*
				 * ------------------------------------------------
				 * 3D Terrain
				 * ------------------------------------------------
				 */

				terrain: {

					source: "terrain",

					exaggeration: 1

				}

			},


			/*
			 * ----------------------------------------------------
			 * Map Settings
			 * ----------------------------------------------------
			 */

			hash: true,


			/*
			 * 初期ズーム
			 */

			zoom: 17,


			/*
			 * 荻窪付近
			 */

			center: [

				139.6203,
				35.7048

			],


			/*
			 * 3D視点
			 */

			pitch: 60,


			/*
			 * 方位
			 */

			bearing: 0,


			/*
			 * Attribution
			 */

			attributionControl: false

		})



		/*
		 * ========================================================
		 * Navigation Control
		 * ========================================================
		 */

		map.addControl(

			new maplibregl.NavigationControl(),

			"top-right"

		)



		/*
		 * ========================================================
		 * Attribution Control
		 * ========================================================
		 */

		map.addControl(

			new maplibregl.AttributionControl({

				compact: true,

				customAttribution: "地理院タイル"

			})

		)



		/*
		 * ========================================================
		 * COPC Layer
		 * ========================================================
		 *
		 * HTMLと同じ場所に
		 *
		 *     sy.copc.laz
		 *
		 * を配置する。
		 *
		 * ========================================================
		 */

		const copcLayer = new CopcLayer(

			"./sy.copc.laz",

			{


				/*
				 * ------------------------------------------------
				 * 色
				 * ------------------------------------------------
				 *
				 * LAS / COPC のRGBを使用
				 *
				 */

				colorMode: "rgb",


				/*
				 * ------------------------------------------------
				 * Point Size
				 * ------------------------------------------------
				 */

				pointSize: 3,


				/*
				 * ------------------------------------------------
				 * Depth Test
				 * ------------------------------------------------
				 */

				depthTest: false,


				/*
				 * ------------------------------------------------
				 * Root Node
				 * ------------------------------------------------
				 */

				alwaysShowRoot: true,


				/*
				 * ------------------------------------------------
				 * SSAO
				 * ------------------------------------------------
				 */

				enableSSAO: false,


				/*
				 * ------------------------------------------------
				 * Debug
				 * ------------------------------------------------
				 */

				debug: true,


				/*
				 * ------------------------------------------------
				 * COPC Initialization
				 * ------------------------------------------------
				 */

				onInitialized: ({ bounds }) => {


					console.log(
						"COPC initialized",
						bounds
					)


					/*
					 * COPCの中心座標
					 */

					const centerLongitude =
						(bounds.minx + bounds.maxx) / 2


					const centerLatitude =
						(bounds.miny + bounds.maxy) / 2



					console.log(
						"COPC center:",
						centerLongitude,
						centerLatitude
					)



					/*
					 * COPCの中心へ移動
					 */

					map.flyTo({

						center: [

							centerLongitude,
							centerLatitude

						],

						zoom: 17,

						pitch: 60,

						bearing: 0

					})

				}

			}

		)



		/*
		 * ========================================================
		 * Map Load
		 * ========================================================
		 */

		map.on(

			"load",

			() => {

				console.log(
					"Map loaded"
				)


				/*
				 * COPC Layer追加
				 */

				map.addLayer(
					copcLayer
				)

			}

		)



		/*
		 * ========================================================
		 * Error
		 * ========================================================
		 */

		map.on(

			"error",

			(event) => {

				console.error(
					"MapLibre error:",
					event
				)

			}

		)

	</script>

</body>

</html>
