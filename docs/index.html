<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>copc Viewer</title>


  <!-- =========================================================
       MapLibre CSS
       ========================================================= -->

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.0.0/dist/maplibre-gl.css"
  >


  <!-- =========================================================
       Style
       ========================================================= -->

  <style>

    html,
    body {

      margin: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

    }


    #map {

      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

    }

  </style>

</head>


<body>


  <!-- =========================================================
       Map
       ========================================================= -->

  <div id="map"></div>


  <!-- =========================================================
       Application
       ========================================================= -->

  <script type="module">


    /*
     * =========================================================
     * MapLibre
     * =========================================================
     */

    import * as maplibreglModule
      from "https://cdn.jsdelivr.net/npm/maplibre-gl@5.0.0/+esm";


    const maplibregl =
      maplibreglModule.default;


    /*
     * =========================================================
     * COPC Layer
     * =========================================================
     */

    import {
      CopcLayer
    } from "https://cdn.jsdelivr.net/npm/maplibre-copc-layer@0.2.0/+esm";


    /*
     * =========================================================
     * PROJ4
     * =========================================================
     *
     * EPSG:6677
     * JGD2011 / Japan Plane Rectangular CS IX
     *
     * =========================================================
     */

    import proj4
      from "https://cdn.jsdelivr.net/npm/proj4@2.15.0/+esm";


    /*
     * =========================================================
     * Debug
     * =========================================================
     */

    console.log(
      "MapLibre:",
      maplibregl
    );

    console.log(
      "Map:",
      maplibregl.Map
    );

    console.log(
      "CopcLayer:",
      CopcLayer
    );

    console.log(
      "proj4:",
      proj4
    );


    /*
     * =========================================================
     * COPC
     * =========================================================
     */

    const COPC_URL =
      "./sy.copc.laz";


    /*
     * =========================================================
     * Coordinate Reference System
     * =========================================================
     */

    const COPC_EPSG =
      "EPSG:6677";

    const WGS84 =
      "EPSG:4326";


    /*
     * =========================================================
     * EPSG:6677
     * =========================================================
     *
     * JGD2011
     * Japan Plane Rectangular CS IX
     *
     * 原点:
     *
     *   Latitude  = 36°
     *   Longitude = 139°50′
     *
     * Unit:
     *
     *   meter
     *
     * =========================================================
     */

    proj4.defs(

      COPC_EPSG,

      "+proj=tmerc " +
      "+lat_0=36 " +
      "+lon_0=139.8333333333333 " +
      "+k=0.9999 " +
      "+x_0=0 " +
      "+y_0=0 " +
      "+ellps=GRS80 " +
      "+units=m " +
      "+no_defs"

    );


    /*
     * =========================================================
     * COPC Bounds
     * =========================================================
     *
     * sy.copc.laz
     *
     * EPSG:6677
     *
     * X = Easting
     * Y = Northing
     * Z = Height
     *
     * Unit = meter
     *
     * =========================================================
     */

    const copcBounds = {

      minX:
        -19058.80,

      maxX:
        -19011.98,

      minY:
        -32698.68,

      maxY:
        -32645.51,

      minZ:
        44.89,

      maxZ:
        67.36

    };


    /*
     * =========================================================
     * Point Count
     * =========================================================
     */

    const COPC_POINT_COUNT =
      80454;


    /*
     * =========================================================
     * Convert EPSG:6677 → EPSG:4326
     * =========================================================
     *
     * 重要:
     *
     * 今回のLASは
     *
     *   X = Easting
     *   Y = Northing
     *
     * なので、
     *
     *   [x, y]
     *
     * の順番をそのまま使用する。
     *
     * =========================================================
     */

    function convertCopcCoordinate(
      x,
      y
    ) {

      const result =
        proj4(

          COPC_EPSG,

          WGS84,

          [
            x,
            y
          ]

        );


      return {

        longitude:
          result[0],

        latitude:
          result[1]

      };

    }


    /*
     * =========================================================
     * Convert COPC Bounds
     * =========================================================
     */

    function convertCopcBounds() {


      console.log(
        "========================================"
      );

      console.log(
        "COPC BOUNDS"
      );

      console.log(
        "========================================"
      );


      console.log(
        "X:",
        copcBounds.minX,
        "→",
        copcBounds.maxX,
        "m"
      );

      console.log(
        "Y:",
        copcBounds.minY,
        "→",
        copcBounds.maxY,
        "m"
      );

      console.log(
        "Z:",
        copcBounds.minZ,
        "→",
        copcBounds.maxZ,
        "m"
      );


      /*
       * -------------------------------------------------------
       * Southwest
       * -------------------------------------------------------
       */

      const southwest =
        convertCopcCoordinate(

          copcBounds.minX,
          copcBounds.minY

        );


      /*
       * -------------------------------------------------------
       * Northeast
       * -------------------------------------------------------
       */

      const northeast =
        convertCopcCoordinate(

          copcBounds.maxX,
          copcBounds.maxY

        );


      console.log(
        "========================================"
      );

      console.log(
        "WGS84 BOUNDS"
      );

      console.log(
        "========================================"
      );


      console.log(
        "SouthWest:",
        southwest
      );

      console.log(
        "NorthEast:",
        northeast
      );


      console.log(
        "Longitude:",
        southwest.longitude,
        "→",
        northeast.longitude
      );

      console.log(
        "Latitude:",
        southwest.latitude,
        "→",
        northeast.latitude
      );


      return {

        southwest,
        northeast

      };

    }


    /*
     * =========================================================
     * MapLibre
     * =========================================================
     */

    const map =
      new maplibregl.Map({

        container:
          "map",

        style: {

          version:
            8,

          sources: {},

          layers: []

        },

        center: [

          139.6200,
          35.7000

        ],

        zoom:
          15,

        pitch:
          60,

        bearing:
          0

      });


    /*
     * =========================================================
     * MapLibre Error
     * =========================================================
     */

    map.on(

      "error",

      (event) => {

        console.error(
          "MapLibre error:",
          event
        );

      }

    );


    /*
     * =========================================================
     * Map Load
     * =========================================================
     */

    map.on(

      "load",

      () => {


        console.log(
          "========================================"
        );

        console.log(
          "MapLibre loaded"
        );

        console.log(
          "========================================"
        );


        /*
         * =====================================================
         * GSI Aerial Photo
         * =====================================================
         */

        map.addSource(

          "gsi-aerial",

          {

            type:
              "raster",

            tiles: [

              "https://cyberjapandata.gsi.go.jp/xyz/ort/{z}/{x}/{y}.jpg"

            ],

            tileSize:
              256,

            attribution:
              '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a>'

          }

        );


        map.addLayer({

          id:
            "gsi-aerial",

          type:
            "raster",

          source:
            "gsi-aerial",

          paint: {

            "raster-opacity":
              1.0

          }

        });


        /*
         * =====================================================
         * COPC Bounds
         * =====================================================
         */

        const bounds =
          convertCopcBounds();


        /*
         * =====================================================
         * MapLibre Bounds
         * =====================================================
         */

        const mapBounds =
          new maplibregl.LngLatBounds(

            [

              bounds.southwest.longitude,
              bounds.southwest.latitude

            ],

            [

              bounds.northeast.longitude,
              bounds.northeast.latitude

            ]

          );


        console.log(
          "MapLibre Bounds:",
          mapBounds
        );


        /*
         * =====================================================
         * COPC Layer
         * =====================================================
         *
         * onInitializedは指定しない。
         *
         * FunctionをWorkerへ渡すと
         * DataCloneErrorになるため。
         *
         * =====================================================
         */

      const copcLayer = new CopcLayer(
  "./sy.copc.laz",
  {
    colorMode: "white",
    pointSize: 10,
    alwaysShowRoot: true,
    sseThreshold: 100,
    depthTest: false,
    enableSSAO: false,
    debug: true,
  },
  "copc"
);

map.addLayer(copcLayer);

        console.log(
          "COPC layer added"
        );


        /*
         * =====================================================
         * Fit to COPC
         * =====================================================
         */

        map.fitBounds(

          mapBounds,

          {

            padding:
              100,

            duration:
              1000,

            pitch:
              60

          }

        );


        /*
         * =====================================================
         * Final Debug
         * =====================================================
         */

        console.log(
          "========================================"
        );

        console.log(
          "COPC READY"
        );

        console.log(
          "========================================"
        );

        console.log(
          "URL:",
          COPC_URL
        );

        console.log(
          "CRS:",
          COPC_EPSG
        );

        console.log(
          "Point Count:",
          COPC_POINT_COUNT
        );

        console.log(
          "X:",
          copcBounds.minX,
          "→",
          copcBounds.maxX,
          "m"
        );

        console.log(
          "Y:",
          copcBounds.minY,
          "→",
          copcBounds.maxY,
          "m"
        );

        console.log(
          "Z:",
          copcBounds.minZ,
          "→",
          copcBounds.maxZ,
          "m"
        );

        console.log(
          "========================================"
        );


      }

    );


  </script>


</body>

</html>
