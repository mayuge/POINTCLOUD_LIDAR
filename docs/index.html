<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>LAS Point Cloud Viewer</title>


  <!-- =========================================================
       MapLibre GL JS 5
       ========================================================= -->

  <link
    rel="stylesheet"
    href="https://unpkg.com/maplibre-gl@5.7.0/dist/maplibre-gl.css"
  >

  <script
    src="https://unpkg.com/maplibre-gl@5.7.0/dist/maplibre-gl.js"
  ></script>


  <!-- =========================================================
       deck.gl
       ========================================================= -->

  <script
    src="https://unpkg.com/deck.gl@9.3.6/dist.min.js"
  ></script>


  <!-- =========================================================
       loaders.gl LAS
       ========================================================= -->

  <script
    src="https://unpkg.com/@loaders.gl/las@4.3.3/dist/dist.min.js"
  ></script>


  <!-- =========================================================
       proj4
       ========================================================= -->

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.15.0/proj4.js"
  ></script>


  <style>

    html,
    body {

      margin: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #111;

    }


    #map {

      width: 100%;
      height: 100%;

    }


    #info {

      position: absolute;

      left: 10px;
      bottom: 10px;

      z-index: 10;

      padding: 6px 10px;

      background: rgba(255, 255, 255, 0.85);

      font-family: sans-serif;

      font-size: 12px;

      pointer-events: none;

    }

  </style>

</head>


<body>


<div id="map"></div>


<div id="info">

  国土地理院「全国最新写真（シームレス）」＋
  産総研「陸地統合DEM」＋ LAS

</div>


<script>


/*
 * ============================================================
 * Viewer設定
 * ============================================================
 */

const CENTER = {

  longitude:
    139.6228812732044,

  latitude:
    35.70540600403263

};


const INITIAL_ZOOM = 18;


/*
 * ============================================================
 * LAS CRS
 * ============================================================
 *
 * JGD2011 / Japan Plane Rectangular CS IX
 *
 * EPSG:6677
 *
 * ============================================================
 */

proj4.defs(

  "EPSG:6677",

  "+proj=tmerc " +
  "+lat_0=36 " +
  "+lon_0=139.8333333333333 " +
  "+k=0.9999 " +
  "+x_0=0 " +
  "+y_0=0 " +
  "+ellps=GRS80 " +
  "+units=m " +
  "+no_defs"

);


/*
 * ============================================================
 * LAS → WGS84
 * ============================================================
 */

function convertCoordinate(

  x,
  y,
  z

) {

  const [

    longitude,
    latitude

  ] =

    proj4(

      "EPSG:6677",

      "EPSG:4326",

      [
        x,
        y
      ]

    );


  return [

    longitude,
    latitude,
    z

  ];

}


/*
 * ============================================================
 * RGB変換
 * ============================================================
 *
 * loaders.glから返ってくる値を確認して、
 * deck.gl用の 0〜255 に変換する。
 *
 * 対応:
 *
 *   0〜1
 *   0〜255
 *   0〜65535
 *
 * ============================================================
 */

function convertColorValue(value) {

  if (
    value === undefined ||
    value === null ||
    Number.isNaN(value)
  ) {

    return 0;

  }


  /*
   * 0〜1 のnormalized値
   */

  if (value >= 0 && value <= 1) {

    return Math.round(

      value * 255

    );

  }


  /*
   * 8bit RGB
   */

  if (value <= 255) {

    return Math.round(value);

  }


  /*
   * 16bit RGB
   */

  return Math.round(

    value / 65535 * 255

  );

}


/*
 * ============================================================
 * RGB
 * ============================================================
 */

function convertColor(

  r,
  g,
  b

) {

  return [

    Math.max(
      0,
      Math.min(
        255,
        convertColorValue(r)
      )
    ),

    Math.max(
      0,
      Math.min(
        255,
        convertColorValue(g)
      )
    ),

    Math.max(
      0,
      Math.min(
        255,
        convertColorValue(b)
      )
    )

  ];

}


/*
 * ============================================================
 * LAS読み込み
 * ============================================================
 */

async function loadLAS() {

  console.log(

    "LAS loading..."

  );


  /*
   * LAS
   */

  const data =

    await loaders.load(

      "./sy.las",

      loaders.LASLoader

    );


  console.log(

    "LAS loaded"

  );


  console.log(

    data

  );


  /*
   * ==========================================================
   * POSITION
   * ==========================================================
   */

  const positionAttribute =

    data
      .attributes
      .POSITION;


  const positions =

    positionAttribute.value;


  /*
   * ==========================================================
   * COLOR
   * ==========================================================
   */

  const colorAttribute =

    data
      .attributes
      .COLOR_0;


  const colors =

    colorAttribute?.value;


  /*
   * ==========================================================
   * 点数
   * ==========================================================
   */

  const pointCount =

    data
      .header
      .vertexCount;


  console.log(

    "Point count:",

    pointCount

  );


  /*
   * ==========================================================
   * RGB情報確認
   * ==========================================================
   */

  console.log(

    "COLOR_0:",

    colorAttribute

  );


  console.log(

    "COLOR_0 size:",

    colorAttribute?.size

  );


  console.log(

    "COLOR_0 type:",

    colors?.constructor?.name

  );


  if (colors) {

    console.log(

      "First raw color values:",

      Array.from(

        colors.slice(

          0,
          Math.min(

            12,
            colors.length

          )

        )

      )

    );

  }


  /*
   * ==========================================================
   * RGBチャンネル数
   * ==========================================================
   *
   * 通常:
   *
   *   size = 3
   *       R G B
   *
   * または
   *
   *   size = 4
   *       R G B A
   *
   * ==========================================================
   */

  const colorSize =

    colorAttribute?.size || 3;


  console.log(

    "Using color size:",

    colorSize

  );


  /*
   * ==========================================================
   * PointCloudデータ
   * ==========================================================
   */

  const points =

    new Array(

      pointCount

    );


  /*
   * ==========================================================
   * 座標・RGB変換
   * ==========================================================
   */

  for (

    let i = 0;

    i < pointCount;

    i++

  ) {


    /*
     * ========================================================
     * LAS座標
     * ========================================================
     */

    const x =

      positions[

        i * 3

      ];


    const y =

      positions[

        i * 3 + 1

      ];


    const z =

      positions[

        i * 3 + 2

      ];


    /*
     * ========================================================
     * WGS84
     * ========================================================
     */

    const position =

      convertCoordinate(

        x,
        y,
        z

      );


    /*
     * ========================================================
     * RGB
     * ========================================================
     */

    let color = [

      255,
      255,
      255

    ];


    if (colors) {


      /*
       * colorSizeに応じて
       * RGBの位置を取得
       */

      const colorIndex =

        i * colorSize;


      const r =

        colors[colorIndex];


      const g =

        colors[colorIndex + 1];


      const b =

        colors[colorIndex + 2];


      color =

        convertColor(

          r,
          g,
          b

        );


      /*
       * 最初の点だけ確認
       */

      if (i === 0) {

        console.log(

          "First raw RGB:",

          [
            r,
            g,
            b
          ]

        );


        console.log(

          "First converted RGB:",

          color

        );

      }

    }


    /*
     * ========================================================
     * Point
     * ========================================================
     */

    points[i] = {

      position,

      color

    };

  }


  /*
   * ==========================================================
   * 確認
   * ==========================================================
   */

  console.log(

    "First converted point:",

    points[0]

  );


  return points;

}


/*
 * ============================================================
 * MapLibre
 * ============================================================
 *
 * Background
 *
 *   GSI seamlessphoto
 *
 * Terrain
 *
 *   AIST Integrated Land DEM
 *
 * ============================================================
 */

const map =

  new maplibregl.Map({

    container:
      "map",


    /*
     * ========================================================
     * Style
     * ========================================================
     */

    style: {

      version: 8,


      /*
       * ======================================================
       * Sources
       * ======================================================
       */

      sources: {


        /*
         * ----------------------------------------------------
         * GSI シームレス空中写真
         * ----------------------------------------------------
         */

        "gsi-photo": {

          type:
            "raster",

          tiles: [

            "https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg"

          ],

          tileSize:
            256,

          attribution:
            "国土地理院"

        },


        /*
         * ----------------------------------------------------
         * 産総研 陸地統合DEM
         * ----------------------------------------------------
         */

        "terrain": {

          type:
            "raster-dem",

          tiles: [

            "https://gbank.gsj.jp/seamless/elev/terrainRGB/land/{z}/{y}/{x}.png"

          ],

          tileSize:
            256,

          encoding:
            "mapbox",

          attribution:

            "<a href=\"https://tiles.gsj.jp/tiles/elev/tiles.html\" target=\"_blank\">" +
            "産総研 陸地統合DEM" +
            "</a>"

        }

      },


      /*
       * ======================================================
       * Layers
       * ======================================================
       */

      layers: [

        {

          id:
            "gsi-photo",

          type:
            "raster",

          source:
            "gsi-photo",

          paint: {

            "raster-opacity":
              1

          }

        }

      ],


      /*
       * ======================================================
       * Terrain
       * ======================================================
       */

      terrain: {

        source:
          "terrain",

        exaggeration:
          1

      }

    },


    /*
     * ========================================================
     * 初期位置
     * ========================================================
     */

    center: [

      CENTER.longitude,

      CENTER.latitude

    ],


    zoom:
      INITIAL_ZOOM,


    pitch:
      60,


    bearing:
      0

  });


/*
 * ============================================================
 * Navigation Control
 * ============================================================
 */

map.addControl(

  new maplibregl.NavigationControl(),

  "top-right"

);


/*
 * ============================================================
 * MapLibre Load
 * ============================================================
 */

map.on(

  "load",

  async () => {

    try {


      console.log(

        "MapLibre loaded"

      );


      console.log(

        "AIST terrain enabled"

      );


      /*
       * ======================================================
       * LAS
       * ======================================================
       */

      const points =

        await loadLAS();


      /*
       * ======================================================
       * PointCloudLayer
       * ======================================================
       */

      const pointCloudLayer =

        new deck.PointCloudLayer({

          id:
            "las-point-cloud",


          /*
           * データ
           */

          data:
            points,


          /*
           * 座標
           */

          getPosition:

            d => d.position,


          /*
           * RGB
           */

          getColor:

            d => d.color,


          /*
           * 法線
           */

          getNormal:

            [0, 0, 1],


          /*
           * 点サイズ
           */

          pointSize:
            2,


          /*
           * 選択
           */

          pickable:
            true,


          /*
           * Tooltip
           */

          getTooltip:

            ({ object }) => {

              if (!object) {

                return null;

              }


              return {

                text:

                  `経度: ${
                    object.position[0].toFixed(7)
                  }\n` +

                  `緯度: ${
                    object.position[1].toFixed(7)
                  }\n` +

                  `標高: ${
                    object.position[2].toFixed(2)
                  } m`

              };

            }

        });


      /*
       * ======================================================
       * deck.gl Overlay
       * ======================================================
       */

      const overlay =

        new deck.MapboxOverlay({

          interleaved:
            true,

          layers: [

            pointCloudLayer

          ]

        });


      /*
       * ======================================================
       * MapLibreへ追加
       * ======================================================
       */

      map.addControl(

        overlay

      );


      console.log(

        "deck.gl overlay added"

      );

    }

    catch (error) {

      console.error(

        "Viewer error:",

        error

      );

    }

  }

);


</script>


</body>

</html>
