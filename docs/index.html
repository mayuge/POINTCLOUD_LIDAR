<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>LAS Point Cloud Viewer</title>


  <!-- =========================================================
       MapLibre GL JS 5
       ========================================================= -->

  <link
    rel="stylesheet"
    href="https://unpkg.com/maplibre-gl@5.7.0/dist/maplibre-gl.css"
  >

  <script
    src="https://unpkg.com/maplibre-gl@5.7.0/dist/maplibre-gl.js"
  ></script>


  <!-- =========================================================
       deck.gl
       ========================================================= -->

  <script
    src="https://unpkg.com/deck.gl@9.3.6/dist.min.js"
  ></script>


  <!-- =========================================================
       loaders.gl LAS
       ========================================================= -->

  <script
    src="https://unpkg.com/@loaders.gl/las@4.3.3/dist/dist.min.js"
  ></script>


  <!-- =========================================================
       proj4
       ========================================================= -->

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.15.0/proj4.js"
  ></script>


  <style>

    html,
    body {

      margin: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #111;

    }


    #map {

      width: 100%;
      height: 100%;

    }


    #info {

      position: absolute;

      left: 10px;
      bottom: 10px;

      z-index: 10;

      padding: 6px 10px;

      background: rgba(255, 255, 255, 0.85);

      font-family: sans-serif;

      font-size: 12px;

      pointer-events: none;

    }

  </style>

</head>


<body>


<div id="map"></div>


<div id="info">

  国土地理院「全国最新写真（シームレス）」＋
  産総研「陸地統合DEM」＋ LAS

</div>


<script>


/*
 * ============================================================
 * Viewer設定
 * ============================================================
 */

const CENTER = {

  longitude:
    139.6228812732044,

  latitude:
    35.70540600403263

};


const INITIAL_ZOOM = 18;


/*
 * ============================================================
 * LAS CRS
 * ============================================================
 *
 * JGD2011 / Japan Plane Rectangular CS IX
 *
 * EPSG:6677
 *
 * ============================================================
 */

proj4.defs(

  "EPSG:6677",

  "+proj=tmerc " +
  "+lat_0=36 " +
  "+lon_0=139.8333333333333 " +
  "+k=0.9999 " +
  "+x_0=0 " +
  "+y_0=0 " +
  "+ellps=GRS80 " +
  "+units=m " +
  "+no_defs"

);


/*
 * ============================================================
 * LAS → WGS84
 * ============================================================
 */

function convertCoordinate(

  x,
  y,
  z

) {

  const [

    longitude,
    latitude

  ] =

    proj4(

      "EPSG:6677",

      "EPSG:4326",

      [
        x,
        y
      ]

    );


  return [

    longitude,
    latitude,
    z

  ];

}


/*
 * ============================================================
 * LAS RGB 16bit → deck.gl RGB 8bit
 * ============================================================
 *
 * LASのRGBは uint16。
 *
 *   0     → 0
 *   65535 → 255
 *
 * ============================================================
 */

function convertLASRGB16(

  r,
  g,
  b

) {

  return [

    Math.round(
      r / 65535 * 255
    ),

    Math.round(
      g / 65535 * 255
    ),

    Math.round(
      b / 65535 * 255
    )

  ];

}


/*
 * ============================================================
 * LAS Point Format 3
 * 生バイナリからRGBを直接取得
 * ============================================================
 *
 * Point Data Record Format 3
 *
 * Point Record Size:
 *
 *   34 bytes
 *
 *
 * RGB:
 *
 *   Red   → offset 28
 *   Green → offset 30
 *   Blue  → offset 32
 *
 *
 * 各値:
 *
 *   uint16
 *
 *
 * LASはLittle Endian。
 *
 * ============================================================
 */

function readLASRGB(

  buffer,

  pointOffset,

  pointIndex,

  pointRecordSize

) {

  const offset =

    pointOffset +
    pointIndex * pointRecordSize;


  const view =

    new DataView(

      buffer

    );


  /*
   * Red
   */

  const r =

    view.getUint16(

      offset + 28,

      true

    );


  /*
   * Green
   */

  const g =

    view.getUint16(

      offset + 30,

      true

    );


  /*
   * Blue
   */

  const b =

    view.getUint16(

      offset + 32,

      true

    );


  return [

    r,
    g,
    b

  ];

}


/*
 * ============================================================
 * LAS読み込み
 * ============================================================
 */

async function loadLAS() {

  console.log(

    "LAS loading..."

  );


  /*
   * ==========================================================
   * LASファイルを生バイナリとして取得
   * ==========================================================
   */

  const rawResponse =

    await fetch(

      "./sy.las"

    );


  if (!rawResponse.ok) {

    throw new Error(

      `LAS file load failed: ${rawResponse.status} ${rawResponse.statusText}`

    );

  }


  const rawBuffer =

    await rawResponse.arrayBuffer();


  console.log(

    "Raw LAS buffer size:",

    rawBuffer.byteLength

  );


  /*
   * ==========================================================
   * loaders.gl
   *
   * 座標の読み取りに使用
   * ==========================================================
   */

  const data =

    await loaders.load(

      rawBuffer,

      loaders.LASLoader

    );


  console.log(

    "LAS loaded"

  );


  console.log(

    data

  );


  /*
   * ==========================================================
   * LAS loader情報
   * ==========================================================
   */

  const loaderData =

    data.loaderData;


  const pointsOffset =

    loaderData.pointsOffset;


  const pointsStructSize =

    loaderData.pointsStructSize;


  const pointsFormatId =

    loaderData.pointsFormatId;


  console.log(

    "Point offset:",

    pointsOffset

  );


  console.log(

    "Point record size:",

    pointsStructSize

  );


  console.log(

    "Point format:",

    pointsFormatId

  );


  /*
   * ==========================================================
   * Point Format確認
   * ==========================================================
   *
   * 今回想定:
   *
   *   Point Format 3
   *   Record Size 34
   *
   * ==========================================================
   */

  if (

    pointsFormatId !== 3

  ) {

    console.warn(

      "This code expects LAS Point Format 3. Actual format:",

      pointsFormatId

    );

  }


  if (

    pointsStructSize !== 34

  ) {

    console.warn(

      "Expected Point Record Size 34. Actual size:",

      pointsStructSize

    );

  }


  /*
   * ==========================================================
   * POSITION
   * ==========================================================
   */

  const positionAttribute =

    data
      .attributes
      .POSITION;


  const positions =

    positionAttribute.value;


  /*
   * ==========================================================
   * COLOR_0
   * ==========================================================
   *
   * 注意:
   *
   * 今回はこの値をRGBには使用しない。
   *
   * loaders.glでは
   *
   *   [0, 0, 0, 255]
   *
   * になってしまっているため、
   * 生LASバイナリからRGBを読む。
   *
   * ==========================================================
   */

  const colorAttribute =

    data
      .attributes
      .COLOR_0;


  console.log(

    "COLOR_0:",

    colorAttribute

  );


  console.log(

    "COLOR_0 size:",

    colorAttribute?.size

  );


  console.log(

    "COLOR_0 type:",

    colorAttribute?.value?.constructor?.name

  );


  if (

    colorAttribute?.value

  ) {

    console.log(

      "loader COLOR_0 first values:",

      Array.from(

        colorAttribute.value.slice(

          0,

          12

        )

      )

    );

  }


  /*
   * ==========================================================
   * 点数
   * ==========================================================
   */

  const pointCount =

    data
      .header
      .vertexCount;


  console.log(

    "Point count:",

    pointCount

  );


  /*
   * ==========================================================
   * PointCloudデータ
   * ==========================================================
   */

  const points =

    new Array(

      pointCount

    );


  /*
   * ==========================================================
   * 座標・RGB変換
   * ==========================================================
   */

  for (

    let i = 0;

    i < pointCount;

    i++

  ) {


    /*
     * ========================================================
     * LAS座標
     * ========================================================
     */

    const x =

      positions[

        i * 3

      ];


    const y =

      positions[

        i * 3 + 1

      ];


    const z =

      positions[

        i * 3 + 2

      ];


    /*
     * ========================================================
     * WGS84
     * ========================================================
     */

    const position =

      convertCoordinate(

        x,
        y,
        z

      );


    /*
     * ========================================================
     * RGB
     * ========================================================
     *
     * loaders.glのCOLOR_0は使わない。
     *
     * sy.lasの生バイナリから直接取得。
     *
     * ========================================================
     */

    const rawRGB =

      readLASRGB(

        rawBuffer,

        pointsOffset,

        i,

        pointsStructSize

      );


    /*
     * ========================================================
     * 16bit → 8bit
     * ========================================================
     */

    const color =

      convertLASRGB16(

        rawRGB[0],
        rawRGB[1],
        rawRGB[2]

      );


    /*
     * ========================================================
     * 最初の点を確認
     * ========================================================
     */

    if (

      i === 0

    ) {

      console.log(

        "First LAS raw RGB16:",

        rawRGB

      );


      console.log(

        "First converted RGB:",

        color

      );


      console.log(

        "First position:",

        position

      );

    }


    /*
     * ========================================================
     * Point
     * ========================================================
     */

    points[i] = {

      position,

      color

    };

  }


  /*
   * ==========================================================
   * 最終確認
   * ==========================================================
   */

  console.log(

    "First converted point:",

    points[0]

  );


  return points;

}


/*
 * ============================================================
 * MapLibre
 * ============================================================
 *
 * Background
 *
 *   GSI seamlessphoto
 *
 * Terrain
 *
 *   AIST Integrated Land DEM
 *
 * ============================================================
 */

const map =

  new maplibregl.Map({

    container:
      "map",


    /*
     * ========================================================
     * Style
     * ========================================================
     */

    style: {

      version: 8,


      /*
       * ======================================================
       * Sources
       * ======================================================
       */

      sources: {


        /*
         * ----------------------------------------------------
         * GSI シームレス空中写真
         * ----------------------------------------------------
         */

        "gsi-photo": {

          type:
            "raster",

          tiles: [

            "https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg"

          ],

          tileSize:
            256,

          attribution:
            "国土地理院"

        },


        /*
         * ----------------------------------------------------
         * 産総研 陸地統合DEM
         * ----------------------------------------------------
         */

        "terrain": {

          type:
            "raster-dem",

          tiles: [

            "https://gbank.gsj.jp/seamless/elev/terrainRGB/land/{z}/{y}/{x}.png"

          ],

          tileSize:
            256,

          encoding:
            "mapbox",

          attribution:

            "<a href=\"https://tiles.gsj.jp/tiles/elev/tiles.html\" target=\"_blank\">" +

            "産総研 陸地統合DEM" +

            "</a>"

        }

      },


      /*
       * ======================================================
       * Layers
       * ======================================================
       */

      layers: [

        {

          id:
            "gsi-photo",

          type:
            "raster",

          source:
            "gsi-photo",

          paint: {

            "raster-opacity":
              1

          }

        }

      ],


      /*
       * ======================================================
       * Terrain
       * ======================================================
       */

      terrain: {

        source:
          "terrain",

        exaggeration:
          1

      }

    },


    /*
     * ========================================================
     * 初期位置
     * ========================================================
     */

    center: [

      CENTER.longitude,

      CENTER.latitude

    ],


    zoom:
      INITIAL_ZOOM,


    pitch:
      60,


    bearing:
      0

  });


/*
 * ============================================================
 * Navigation Control
 * ============================================================
 */

map.addControl(

  new maplibregl.NavigationControl(),

  "top-right"

);


/*
 * ============================================================
 * MapLibre Load
 * ============================================================
 */

map.on(

  "load",

  async () => {

    try {


      console.log(

        "MapLibre loaded"

      );


      console.log(

        "AIST terrain enabled"

      );


      /*
       * ======================================================
       * LAS
       * ======================================================
       */

      const points =

        await loadLAS();


      /*
       * ======================================================
       * PointCloudLayer
       * ======================================================
 */

      const pointCloudLayer =

        new deck.PointCloudLayer({

          id:
            "las-point-cloud",


          /*
           * ==================================================
           * データ
           * ==================================================
           */

          data:
            points,


          /*
           * ==================================================
           * 座標
           * ==================================================
           */

          getPosition:

            d => d.position,


          /*
           * ==================================================
           * RGB
           * ==================================================
           */

          getColor:

            d => d.color,


          /*
           * ==================================================
           * 法線
           * ==================================================
           */

          getNormal:

            [0, 0, 1],


          /*
           * ==================================================
           * 点サイズ
           * ==================================================
           */

          pointSize:
            2,


          /*
           * ==================================================
           * 選択
           * ==================================================
           */

          pickable:
            true,


          /*
           * ==================================================
           * Tooltip
           * ==================================================
           */

          getTooltip:

            ({ object }) => {

              if (!object) {

                return null;

              }


              return {

                text:

                  `経度: ${
                    object.position[0].toFixed(7)
                  }\n` +

                  `緯度: ${
                    object.position[1].toFixed(7)
                  }\n` +

                  `標高: ${
                    object.position[2].toFixed(2)
                  } m`

              };

            }

        });


      /*
       * ======================================================
       * deck.gl Overlay
       * ======================================================
       */

      const overlay =

        new deck.MapboxOverlay({

          interleaved:
            true,

          layers: [

            pointCloudLayer

          ]

        });


      /*
       * ======================================================
       * MapLibreへ追加
       * ======================================================
       */

      map.addControl(

        overlay

      );


      console.log(

        "deck.gl overlay added"

      );

    }

    catch (error) {

      console.error(

        "Viewer error:",

        error

      );

    }

  }

);


</script>


</body>

</html>
