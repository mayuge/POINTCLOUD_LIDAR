<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LAS Point Cloud Viewer</title>

  <!-- deck.gl -->
  <script src="https://unpkg.com/deck.gl@9.3.6/dist.min.js"></script>

  <!-- loaders.gl LAS -->
  <script src="https://unpkg.com/@loaders.gl/las@4.3.3/dist/dist.min.js"></script>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
    }

    #app {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

<div id="app"></div>

<script>

  /*
   * ----------------------------------------
   * LAS Loader
   * ----------------------------------------
   */

  const LASLoader = loaders.LASLoader;


  /*
   * ----------------------------------------
   * DeckGL
   * ----------------------------------------
   */

  const deckgl = new deck.DeckGL({

    container: "app",

    /*
     * 最初は適当な視点
     */
    initialViewState: {

      longitude: 137,

      latitude: 36,

      zoom: 15,

      pitch: 60,

      bearing: 0

    },

    controller: true,

    /*
     * ツールチップ
     */
    getTooltip: ({ object }) => {

      if (!object) {
        return null;
      }

      return JSON.stringify(object);

    },

    layers: [

      new deck.PointCloudLayer({

        id: "las-point-cloud",

        /*
         * GitHub Pages上のsy.las
         */
        data: "./sy.las",

        /*
         * LAS Loader
         */
        loaders: [
          LASLoader
        ],

        /*
         * 点の大きさ
         */
        pointSize: 2,

        /*
         * 色
         */
        getColor: [255, 255, 255],

        /*
         * 法線
         */
        getNormal: [0, 0, 1],

        /*
         * クリック可能
         */
        pickable: true,

        /*
         * LAS読み込み完了
         */
        onDataLoad: (data) => {

          console.log("LAS loaded");

          console.log(data);

        },

        /*
         * エラー
         */
        onError: (error) => {

          console.error(
            "LAS loading error:",
            error
          );

        }

      })

    ]

  });

</script>

</body>

</html>
