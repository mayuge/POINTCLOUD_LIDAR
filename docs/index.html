<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LAS Point Cloud Viewer</title>

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.0.0/dist/maplibre-gl.css"
  >

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    #map {
      position: absolute;
      inset: 0;
    }
  </style>
</head>

<body>

  <div id="map"></div>

  <script type="module">

    /*
     * =========================================================
     * MapLibre
     * =========================================================
     */
    import * as maplibregl
      from "https://cdn.jsdelivr.net/npm/maplibre-gl@5.0.0/+esm";


    /*
     * =========================================================
     * COPC
     * =========================================================
     *
     * esm.sh ではなく jsDelivr のESM変換を使用。
     */
    import {
      CopcLayer
    } from "https://cdn.jsdelivr.net/npm/maplibre-copc-layer@0.2.0/+esm";


    console.log(
      "MapLibre:",
      maplibregl
    );

    console.log(
      "CopcLayer:",
      CopcLayer
    );


    /*
     * =========================================================
     * Map
     * =========================================================
     */
    const map = new maplibregl.Map({

      container: "map",

      style: {
        version: 8,

        sources: {},

        layers: []
      },

      center: [
        139.6200,
        35.7000
      ],

      zoom: 15,

      pitch: 60,

      bearing: 0

    });


    /*
     * =========================================================
     * 地理院航空写真
     * =========================================================
     */
    map.on(
      "load",
      () => {

        map.addSource(
          "gsi-aerial",
          {
            type: "raster",

            tiles: [
              "https://cyberjapandata.gsi.go.jp/xyz/ort/{z}/{x}/{y}.jpg"
            ],

            tileSize: 256,

            attribution:
              '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a>'
          }
        );


        map.addLayer({

          id: "gsi-aerial",

          type: "raster",

          source: "gsi-aerial",

          paint: {
            "raster-opacity": 1
          }

        });


        /*
         * =====================================================
         * COPC
         * =====================================================
         */
        const copcLayer = new CopcLayer({

          id: "copc",

          url: "./sy.copc.laz",

          colorMode: "rgb",

          pointSize: 3,

          depthTest: false,

          alwaysShowRoot: true,

          enableSSAO: false,

          debug: true,

          onInitialized: (layer) => {

            console.log(
              "COPC initialized",
              layer
            );

            if (layer.bounds) {

              console.log(
                "COPC bounds:",
                layer.bounds
              );

            }

          }

        });


        /*
         * =====================================================
         * COPC Layer
         * =====================================================
         */
        map.addLayer(
          copcLayer
        );

      }
    );


    /*
     * =========================================================
     * Error
     * =========================================================
     */
    map.on(
      "error",
      (event) => {

        console.error(
          "MapLibre error:",
          event
        );

      }
    );

  </script>

</body>
</html>
