<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LiDAR Viewer</title>

  <!-- MapLibre -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/maplibre-gl@6.7.0/dist/maplibre-gl.css"
  >

  <!-- maplibre-gl-lidar -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/maplibre-gl-lidar/dist/style.css"
  >

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    #map {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

<div id="map"></div>

<script type="module">

  import maplibregl from
    "https://unpkg.com/maplibre-gl@6.7.0/dist/maplibre-gl.mjs";

  import {
    LidarControl
  } from
    "https://unpkg.com/maplibre-gl-lidar/dist/maplibre-gl-lidar.mjs";


  /*
   * ----------------------------------------
   * MapLibre
   * ----------------------------------------
   */

  const map = new maplibregl.Map({

    container: "map",

    style:
      "https://basemaps.cartocdn.com/gl/positron-gl-style/style.json",

    center: [
      137.0,
      35.0
    ],

    zoom: 10,

    pitch: 60,

    bearing: 0,

    maxPitch: 85

  });


  /*
   * ----------------------------------------
   * LiDAR
   * ----------------------------------------
   */

  map.on("load", () => {

    const lidarControl = new LidarControl({

      title: "LiDAR",

      collapsed: false,

      pointSize: 2,

      colorScheme: "elevation",

      pickable: true

    });


    map.addControl(
      lidarControl,
      "top-right"
    );


    /*
     * 直下の sy.las を読み込む
     */

    lidarControl.loadPointCloud(
      "./sy.las"
    );


    /*
     * 読み込み完了
     */

    lidarControl.on("load", (event) => {

      console.log(
        "LiDAR loaded:",
        event.pointCloud
      );

      /*
       * 点群の範囲へ移動
       */

      lidarControl.flyToPointCloud();

    });


  });

</script>

</body>
</html>
