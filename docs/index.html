<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LAS Point Cloud Viewer</title>

  <!-- =========================================================
       MapLibre CSS
       ========================================================= -->
  <link
    href="https://unpkg.com/maplibre-gl@5.0.0/dist/maplibre-gl.css"
    rel="stylesheet"
  >

  <!-- =========================================================
       maplibre-gl shim
       
       maplibre-copc-layer は内部で
       
         import maplibregl from "maplibre-gl"
       
       としているため、MapLibre v5 の namespace export を
       default export に変換する。
       
       外部の maplibre-shim.js は不要。
       ========================================================= -->
  <script type="importmap">
  {
    "imports": {
      "maplibre-gl": "data:text/javascript;charset=utf-8,import%20*%20as%20maplibregl%20from%20'https%3A%2F%2Fesm.sh%2Fmaplibre-gl%405.0.0%3Ftarget%3Des2022'%3B%20export%20default%20maplibregl%3B%20export%20*%20from%20'https%3A%2F%2Fesm.sh%2Fmaplibre-gl%405.0.0%3Ftarget%3Des2022'%3B"
    }
  }
  </script>

</head>

<body>

  <div
    id="map"
    style="
      position:absolute;
      inset:0;
    "
  ></div>

  <!-- =========================================================
       Application
       ========================================================= -->
  <script type="module">

    /*
     * ---------------------------------------------------------
     * MapLibre
     * ---------------------------------------------------------
     *
     * importmap により
     *
     *   "maplibre-gl"
     *
     * が data URL の shim に解決される。
     *
     * ここでは namespace import を使う。
     * ---------------------------------------------------------
     */
    import * as maplibregl
      from "maplibre-gl";


    /*
     * ---------------------------------------------------------
     * COPC Layer
     * ---------------------------------------------------------
     */
    import {
      CopcLayer
    } from "https://esm.sh/maplibre-copc-layer@0.2.0?target=es2022";


    /*
     * ---------------------------------------------------------
     * Map
     * ---------------------------------------------------------
     */
    const map = new maplibregl.Map({

      container: "map",

      style: {
        version: 8,

        sources: {},

        layers: []
      },

      center: [
        139.6200,
        35.7000
      ],

      zoom: 15,

      pitch: 60,

      bearing: 0

    });


    /*
     * ---------------------------------------------------------
     * 地理院航空写真
     * ---------------------------------------------------------
     */
    map.addSource(
      "gsi-aerial",
      {
        type: "raster",

        tiles: [
          "https://cyberjapandata.gsi.go.jp/xyz/ort/{z}/{x}/{y}.jpg"
        ],

        tileSize: 256,

        attribution:
          '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a>'
      }
    );


    map.addLayer({

      id: "gsi-aerial",

      type: "raster",

      source: "gsi-aerial",

      paint: {

        "raster-opacity": 1.0

      }

    });


    /*
     * ---------------------------------------------------------
     * COPC
     * ---------------------------------------------------------
     */
    const copcLayer = new CopcLayer({

      id: "copc",

      url: "./sy.copc.laz",

      /*
       * LAS RGBをそのまま利用
       */
      colorMode: "rgb",

      /*
       * 点のサイズ
       */
      pointSize: 3,

      /*
       * 深度テスト
       */
      depthTest: false,

      /*
       * Root nodeを常に表示
       */
      alwaysShowRoot: true,

      /*
       * SSAO
       */
      enableSSAO: false,

      /*
       * デバッグ
       */
      debug: true,

      /*
       * 初期化後
       */
      onInitialized: (layer) => {

        console.log(
          "COPC initialized",
          layer
        );

        /*
         * bounds が取得できる場合
         */
        if (layer.bounds) {

          console.log(
            "COPC bounds:",
            layer.bounds
          );

        }

      }

    });


    /*
     * ---------------------------------------------------------
     * MapLibreに追加
     * ---------------------------------------------------------
     */
    map.on(
      "load",
      () => {

        console.log(
          "MapLibre loaded"
        );

        map.addLayer(
          copcLayer
        );

      }
    );


    /*
     * ---------------------------------------------------------
     * エラー監視
     * ---------------------------------------------------------
     */
    map.on(
      "error",
      (event) => {

        console.error(
          "MapLibre error:",
          event
        );

      }
    );

  </script>

</body>
</html>
