<!doctype html>
<html lang="ja">

<head>

	<meta charset="UTF-8">

	<meta
		name="viewport"
		content="width=device-width, initial-scale=1.0"
	>

	<title>荻窪3D</title>

	<link
		rel="stylesheet"
		href="https://unpkg.com/maplibre-gl@5.0.0/dist/maplibre-gl.css"
	>

	<style>

		html,
		body,
		#map {

			width: 100%;
			height: 100%;

			margin: 0;
			padding: 0;

		}

		body {

			overflow: hidden;

		}

	</style>

</head>


<body>

<div id="map"></div>


<script type="module">

	/*
	 * =========================================================
	 * MapLibre
	 * =========================================================
	 *
	 * あなたが以前使っていたshimと同じ考え方
	 *
	 * =========================================================
	 */

	import * as maplibregl
		from "https://esm.sh/maplibre-gl@5.0.0"


	/*
	 * =========================================================
	 * COPC Layer
	 * =========================================================
	 *
	 * bundleを使わない
	 *
	 */

	import {
		CopcLayer
	}
	from "https://esm.sh/maplibre-copc-layer@0.2.0?target=es2022&external=maplibre-gl"



	/*
	 * =========================================================
	 * Map
	 * =========================================================
	 */

	const map = new maplibregl.Map({

		container: "map",

		style: {

			version: 8,

			sources: {

				/*
				 * 地理院航空写真
				 */

				"gsi-photo": {

					type: "raster",

					tiles: [

						"https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg"

					],

					tileSize: 256,

					attribution: "国土地理院"

				},


				/*
				 * 産総研 陸地統合DEM
				 */

				"terrain": {

					type: "raster-dem",

					tiles: [

						"https://gbank.gsj.jp/seamless/elev/terrainRGB/land/{z}/{y}/{x}.png"

					],

					tileSize: 256,

					encoding: "mapbox",

					attribution: "産総研 陸地統合DEM"

				}

			},


			layers: [

				{

					id: "gsi-photo",

					type: "raster",

					source: "gsi-photo"

				}

			],


			terrain: {

				source: "terrain",

				exaggeration: 1

			}

		},


		hash: true,

		zoom: 17,

		center: [

			139.6203,
			35.7048

		],

		pitch: 60,

		bearing: 0,

		attributionControl: false

	})


	/*
	 * =========================================================
	 * Controls
	 * =========================================================
	 */

	map.addControl(

		new maplibregl.NavigationControl(),

		"top-right"

	)


	map.addControl(

		new maplibregl.AttributionControl({

			compact: true,

			customAttribution: "地理院タイル"

		})

	)



	/*
	 * =========================================================
	 * COPC Layer
	 * =========================================================
	 */

	const copcLayer = new CopcLayer(

		"./sy.copc.laz",

		{

			colorMode: "rgb",

			pointSize: 3,

			depthTest: false,

			alwaysShowRoot: true,

			enableSSAO: false,

			debug: true,


			onInitialized: ({ bounds }) => {

				console.log(
					"COPC initialized",
					bounds
				)


				const centerLongitude =
					(bounds.minx + bounds.maxx) / 2


				const centerLatitude =
					(bounds.miny + bounds.maxy) / 2


				console.log(
					"COPC center:",
					centerLongitude,
					centerLatitude
				)


				map.flyTo({

					center: [

						centerLongitude,
						centerLatitude

					],

					zoom: 17,

					pitch: 60,

					bearing: 0

				})

			}

		}

	)



	/*
	 * =========================================================
	 * Map Load
	 * =========================================================
	 */

	map.on(

		"load",

		() => {

			console.log(
				"Map loaded"
			)


			map.addLayer(
				copcLayer
			)

		}

	)



	/*
	 * =========================================================
	 * Error
	 * =========================================================
	 */

	map.on(

		"error",

		(event) => {

			console.error(
				"MapLibre error:",
				event
			)

		}

	)

</script>

</body>

</html>
