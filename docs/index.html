<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LAS Point Cloud Viewer</title>

  <!-- deck.gl -->
  <script src="https://unpkg.com/deck.gl@9.3.6/dist.min.js"></script>

  <!-- loaders.gl LAS -->
  <script src="https://unpkg.com/@loaders.gl/las@4.3.3/dist/dist.min.js"></script>

  <!-- proj4 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.15.0/proj4.js"></script>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
    }

    #app {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

<div id="app"></div>

<script>

  /*
   * ============================================================
   * 座標系
   * ============================================================
   *
   * LAS:
   *   JGD2011 / Japan Plane Rectangular CS IX
   *   EPSG:6677
   *
   * Google Maps:
   *   WGS84
   *   EPSG:4326
   *
   * LASの座標値は
   *
   *   X = Easting
   *   Y = Northing
   *
   * として扱う。
   *
   */


  proj4.defs(
    "EPSG:6677",

    "+proj=tmerc " +
    "+lat_0=36 " +
    "+lon_0=139.8333333333333 " +
    "+k=0.9999 " +
    "+x_0=0 " +
    "+y_0=0 " +
    "+ellps=GRS80 " +
    "+units=m " +
    "+no_defs"
  );


  /*
   * ============================================================
   * LAS座標 → WGS84
   * ============================================================
   */

  function convertCoordinate(x, y, z) {

    /*
     * EPSG:6677の座標として
     *
     * [Easting, Northing]
     *
     * を渡す
     */

    const [longitude, latitude] =
      proj4(
        "EPSG:6677",
        "EPSG:4326",
        [x, y]
      );


    return [
      longitude,
      latitude,
      z
    ];
  }


  /*
   * ============================================================
   * LAS読み込み
   * ============================================================
   */

  async function loadLAS() {

    console.log("LAS loading...");


    const data =
      await loaders.load(
        "./sy.las",
        loaders.LASLoader
      );


    console.log("LAS loaded");
    console.log(data);


    /*
     * 点群座標
     *
     * Float32Array
     *
     * [x,y,z,x,y,z,...]
     */

    const positions =
      data.attributes.POSITION.value;


    /*
     * RGB
     *
     * [r,g,b,a,r,g,b,a,...]
     */

    const colors =
      data.attributes.COLOR_0?.value;


    const pointCount =
      data.header.vertexCount;


    console.log(
      "Point count:",
      pointCount
    );


    /*
     * deck.gl用データ
     */

    const points =
      new Array(pointCount);


    /*
     * ============================================================
     * 座標変換
     * ============================================================
     */

    for (let i = 0; i < pointCount; i++) {

      const x =
        positions[i * 3];

      const y =
        positions[i * 3 + 1];

      const z =
        positions[i * 3 + 2];


      /*
       * EPSG:6677
       * →
       * WGS84
       */

      const position =
        convertCoordinate(
          x,
          y,
          z
        );


      /*
       * RGB
       */

      let color = [
        255,
        255,
        255
      ];


      if (colors) {

        color = [

          colors[i * 4],

          colors[i * 4 + 1],

          colors[i * 4 + 2]

        ];

      }


      points[i] = {

        position,

        color

      };

    }


    /*
     * 確認
     */

    console.log(
      "First converted point:",
      points[0]
    );


    return points;
  }


  /*
   * ============================================================
   * deck.gl
   * ============================================================
   */

  async function main() {

    /*
     * LAS読み込み
     */

    const points =
      await loadLAS();


    /*
     * Viewer
     */

    new deck.DeckGL({

      container: "app",


      /*
       * Google Mapsで確認した位置
       */

      initialViewState: {

        longitude:
          139.6228812732044,

        latitude:
          35.70540600403263,

        zoom:
          18,

        pitch:
          60,

        bearing:
          0

      },


      /*
       * マウス操作
       */

      controller: true,


      /*
       * Tooltip
       */

      getTooltip: ({ object }) => {

        if (!object) {
          return null;
        }


        return {

          text:
            "Longitude: " +
            object.position[0] +
            "\n" +

            "Latitude: " +
            object.position[1] +
            "\n" +

            "Elevation: " +
            object.position[2]

        };

      },


      /*
       * ========================================================
       * PointCloud
       * ========================================================
       */

      layers: [

        new deck.PointCloudLayer({

          id:
            "las-point-cloud",


          data:
            points,


          /*
           * 座標
           */

          getPosition:
            d => d.position,


          /*
           * RGB
           */

          getColor:
            d => d.color,


          /*
           * 法線
           */

          getNormal:
            [0, 0, 1],


          /*
           * 点の大きさ
           */

          pointSize:
            2,


          /*
           * クリック・ホバー
           */

          pickable:
            true

        })

      ]

    });

  }


  /*
   * ============================================================
   * Start
   * ============================================================
   */

  main().catch(error => {

    console.error(
      "LAS loading error:",
      error
    );

  });

</script>

</body>
</html>
