<!doctype html>
<html lang="ja">

<head>

	<meta charset="UTF-8">

	<meta
		name="viewport"
		content="width=device-width, initial-scale=1.0"
	>

	<title>荻窪3D</title>


	<!-- =========================================================
	     MapLibre CSS
	     ========================================================= -->

	<link
		rel="stylesheet"
		href="https://unpkg.com/maplibre-gl@5.0.0/dist/maplibre-gl.css"
	>


	<!-- =========================================================
	     Import Map
	     =========================================================
	
	     maplibre-copc-layer は内部で
	
	         import maplibregl from "maplibre-gl"
	
	     を行うため、
	
	         maplibre-gl
	         ↓
	         shim
	         ↓
	         esm.sh/maplibre-gl
	
	     と解決させる。
	
	     ========================================================= -->

	<script type="importmap">
	{
		"imports": {
			"maplibre-gl": "data:text/javascript,import%20*%20as%20maplibregl%20from%20%22https%3A%2F%2Fesm.sh%2Fmaplibre-gl%405.0.0%22%3B%0Aexport%20default%20maplibregl%3B%0Aexport%20*%20from%20%22https%3A%2F%2Fesm.sh%2Fmaplibre-gl%405.0.0%22%3B"
		}
	}
	</script>


	<!-- =========================================================
	     Style
	     ========================================================= -->

	<style>

		html,
		body,
		#map {

			width: 100%;
			height: 100%;

			margin: 0;
			padding: 0;

		}

		body {

			overflow: hidden;

		}

	</style>

</head>


<body>


	<!-- =========================================================
	     Map Container
	     ========================================================= -->

	<div id="map"></div>


	<!-- =========================================================
	     Application
	     ========================================================= -->

	<script type="module">


		/*
		 * ========================================================
		 * MapLibre
		 * ========================================================
		 */

		import maplibregl from "maplibre-gl"



		/*
		 * ========================================================
		 * COPC Layer
		 * ========================================================
		 */

		import {
			CopcLayer
		}
		from "https://esm.sh/maplibre-copc-layer@0.2.0?bundle"



		/*
		 * ========================================================
		 * Map
		 * ========================================================
		 */

		const map = new maplibregl.Map({

			container: "map",


			/*
			 * ----------------------------------------------------
			 * Style
			 * ----------------------------------------------------
			 */

			style: {

				version: 8,


				/*
				 * ------------------------------------------------
				 * Sources
				 * ------------------------------------------------
				 */

				sources: {


					/*
					 * 地理院航空写真
					 */

					"gsi-photo": {

						type: "raster",

						tiles: [

							"https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg"

						],

						tileSize: 256,

						attribution: "国土地理院"

					},


					/*
					 * 産総研 陸地統合DEM
					 */

					"terrain": {

						type: "raster-dem",

						tiles: [

							"https://gbank.gsj.jp/seamless/elev/terrainRGB/land/{z}/{y}/{x}.png"

						],

						tileSize: 256,

						encoding: "mapbox",

						attribution: "産総研 陸地統合DEM"

					}

				},


				/*
				 * ------------------------------------------------
				 * Layers
				 * ------------------------------------------------
				 */

				layers: [

					{

						id: "gsi-photo",

						type: "raster",

						source: "gsi-photo"

					}

				],


				/*
				 * ------------------------------------------------
				 * Terrain
				 * ------------------------------------------------
				 */

				terrain: {

					source: "terrain",

					exaggeration: 1

				}

			},


			/*
			 * ----------------------------------------------------
			 * Camera
			 * ----------------------------------------------------
			 */

			hash: true,

			zoom: 17,

			center: [

				139.6203,
				35.7048

			],

			pitch: 60,

			bearing: 0,

			attributionControl: false

		})



		/*
		 * ========================================================
		 * Navigation Control
		 * ========================================================
		 */

		map.addControl(

			new maplibregl.NavigationControl(),

			"top-right"

		)



		/*
		 * ========================================================
		 * Attribution
		 * ========================================================
		 */

		map.addControl(

			new maplibregl.AttributionControl({

				compact: true,

				customAttribution: "地理院タイル"

			})

		)



		/*
		 * ========================================================
		 * COPC Layer
		 * ========================================================
		 */

		const copcLayer = new CopcLayer(

			"./sy.copc.laz",

			{

				/*
				 * RGBカラー
				 */

				colorMode: "rgb",


				/*
				 * 点サイズ
				 */

				pointSize: 3,


				/*
				 * 深度テスト
				 */

				depthTest: false,


				/*
				 * Root Node
				 */

				alwaysShowRoot: true,


				/*
				 * SSAO
				 */

				enableSSAO: false,


				/*
				 * Debug
				 */

				debug: true,


				/*
				 * COPC初期化完了
				 */

				onInitialized: ({ bounds }) => {

					console.log(
						"COPC initialized",
						bounds
					)


					/*
					 * 中心座標
					 */

					const centerLongitude =
						(bounds.minx + bounds.maxx) / 2


					const centerLatitude =
						(bounds.miny + bounds.maxy) / 2


					console.log(
						"COPC center:",
						centerLongitude,
						centerLatitude
					)


					/*
					 * COPC中心へ移動
					 */

					map.flyTo({

						center: [

							centerLongitude,
							centerLatitude

						],

						zoom: 17,

						pitch: 60,

						bearing: 0

					})

				}

			}

		)



		/*
		 * ========================================================
		 * Map Load
		 * ========================================================
		 */

		map.on(

			"load",

			() => {

				console.log(
					"Map loaded"
				)


				map.addLayer(
					copcLayer
				)

			}

		)



		/*
		 * ========================================================
		 * Error
		 * ========================================================
		 */

		map.on(

			"error",

			(event) => {

				console.error(
					"MapLibre error:",
					event
				)

			}

		)

	</script>

</body>

</html>
