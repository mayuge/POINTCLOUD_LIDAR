<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LiDAR Viewer</title>

  <!-- MapLibre -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/maplibre-gl@6.7.0/dist/maplibre-gl.css"
  >

  <!-- maplibre-gl-lidar -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/maplibre-gl-lidar@0.16.2/dist/style.css"
  >

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    #map {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

<div id="map"></div>

<script type="module">

  import maplibregl
    from "https://cdn.jsdelivr.net/npm/maplibre-gl@6.7.0/+esm";

  import { LidarControl }
    from "https://cdn.jsdelivr.net/npm/maplibre-gl-lidar@0.16.2/+esm";


  const map = new maplibregl.Map({
    container: "map",

    style:
      "https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json",

    center: [137, 36],

    zoom: 10,

    pitch: 60,

    maxPitch: 85
  });


  map.on("load", () => {

    const lidarControl = new LidarControl({

      title: "LiDAR",

      collapsed: false,

      pointSize: 2,

      colorScheme: "elevation",

      pickable: true

    });


    map.addControl(
      lidarControl,
      "top-right"
    );


    lidarControl.on("load", () => {

      console.log("LiDAR loaded");

      lidarControl.flyToPointCloud();

    });


    lidarControl.loadPointCloud(
      "./sy.las"
    );

  });

</script>

</body>
</html>
