<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>LAS Point Cloud Viewer</title>


  <!-- =========================================================
       MapLibre CSS
       ========================================================= -->

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.0.0/dist/maplibre-gl.css"
  >


  <!-- =========================================================
       Style
       ========================================================= -->

  <style>

    html,
    body {

      margin: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

    }


    #map {

      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

    }

  </style>

</head>


<body>


  <!-- =========================================================
       Map
       ========================================================= -->

  <div id="map"></div>


  <!-- =========================================================
       Application
       ========================================================= -->

  <script type="module">


    /*
     * =========================================================
     * MapLibre
     * =========================================================
     *
     * jsDelivr +esm は
     *
     *   Module {
     *     default: MapLibre
     *   }
     *
     * を返すため、defaultを取り出す。
     *
     * =========================================================
     */

    import * as maplibreglModule
      from "https://cdn.jsdelivr.net/npm/maplibre-gl@5.0.0/+esm";


    const maplibregl =
      maplibreglModule.default;


    /*
     * =========================================================
     * COPC Layer
     * =========================================================
     */

    import {
      CopcLayer
    } from "https://cdn.jsdelivr.net/npm/maplibre-copc-layer@0.2.0/+esm";


    /*
     * =========================================================
     * Debug
     * =========================================================
     */

    console.log(
      "MapLibre:",
      maplibregl
    );

    console.log(
      "Map:",
      maplibregl.Map
    );

    console.log(
      "CopcLayer:",
      CopcLayer
    );


    /*
     * =========================================================
     * MapLibre
     * =========================================================
     */

    const map =
      new maplibregl.Map({

        container: "map",

        style: {

          version: 8,

          sources: {},

          layers: []

        },

        center: [

          139.6200,
          35.7000

        ],

        zoom: 15,

        pitch: 60,

        bearing: 0

      });


    /*
     * =========================================================
     * MapLibre Error
     * =========================================================
     */

    map.on(
      "error",
      (event) => {

        console.error(
          "MapLibre error:",
          event
        );

      }
    );


    /*
     * =========================================================
     * Map Load
     * =========================================================
     */

    map.on(
      "load",
      () => {

        console.log(
          "MapLibre loaded"
        );


        /*
         * =====================================================
         * GSI Aerial Photo
         * =====================================================
         */

        map.addSource(

          "gsi-aerial",

          {

            type: "raster",

            tiles: [

              "https://cyberjapandata.gsi.go.jp/xyz/ort/{z}/{x}/{y}.jpg"

            ],

            tileSize: 256,

            attribution:
              '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a>'

          }

        );


        map.addLayer({

          id: "gsi-aerial",

          type: "raster",

          source: "gsi-aerial",

          paint: {

            "raster-opacity": 1.0

          }

        });


        /*
         * =====================================================
         * COPC Layer
         * =====================================================
         *
         * 注意：
         *
         * onInitialized は指定しない。
         *
         * maplibre-copc-layer は内部でこの設定値を
         * WorkerへpostMessageするため、
         * JavaScript Functionを渡すと
         *
         * DataCloneError
         *
         * になる。
         *
         * =====================================================
         */

        const copcLayer =
          new CopcLayer({

            /*
             * Layer ID
             */

            id: "copc",


            /*
             * COPC / LAZ
             */

            url: "./sy.copc.laz",


            /*
             * =================================================
             * Color
             * =================================================
             *
             * LASに格納されているRGBを使用
             */

            colorMode: "rgb",


            /*
             * =================================================
             * Point Size
             * =================================================
             */

            pointSize: 3,


            /*
             * =================================================
             * Depth Test
             * =================================================
             */

            depthTest: false,


            /*
             * =================================================
             * Root
             * =================================================
             */

            alwaysShowRoot: true,


            /*
             * =================================================
             * SSAO
             * =================================================
             */

            enableSSAO: false,


            /*
             * =================================================
             * Debug
             * =================================================
             */

            debug: true

          });


        /*
         * =====================================================
         * COPC Layer
         * =====================================================
         */

        console.log(
          "Adding COPC layer..."
        );


        map.addLayer(
          copcLayer
        );


        console.log(
          "COPC layer added"
        );

      }

    );


  </script>

</body>

</html>
